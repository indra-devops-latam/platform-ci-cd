name: Reusable Publish and Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment: dev o prod"
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ecr_repository:
        description: "Nombre del repositorio ECR, sin el registry"
        required: true
        type: string
      eks_cluster:
        required: true
        type: string
      namespace:
        required: true
        type: string
      helm_release:
        required: true
        type: string
      chart_path:
        description: "Ruta al chart Helm en el repositorio del servicio"
        required: true
        type: string
      deploy:
        description: "Publicar y desplegar si es true"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Validate image
    if: ${{ !inputs.deploy }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile.prod
          push: false
          tags: local/${{ inputs.namespace }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-and-deploy:
    name: Publish image and deploy to ${{ inputs.environment }}
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      # El checkout usa el repositorio y commit que llamó a este workflow.
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile.prod
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Configure kubectl for EKS
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          EKS_CLUSTER: ${{ inputs.eks_cluster }}
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Kubernetes access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy with Helm
        env:
          HELM_RELEASE: ${{ inputs.helm_release }}
          CHART_PATH: ${{ inputs.chart_path }}
          K8S_NAMESPACE: ${{ inputs.namespace }}
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          helm upgrade --install \
            "$HELM_RELEASE" \
            "$CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m
